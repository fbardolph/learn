<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Not found · Learning paths</title>
<link rel="stylesheet" href="kit/lesson.css">
<link rel="stylesheet" href="kit/site.css">
<link rel="icon" href="kit/site-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="kit/site-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Learning">
<meta name="theme-color" content="#f5f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
</head><body>
<main class="page"><header><h1>Page not found</h1><p class="lede">That lesson may have moved. <a href="/">See all learning paths</a>.</p></header></main>
<script>
// Local progress: kept in this browser only.
(function () {
  var KEY = 'learn.progress.v1';
  function read() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  var p = read(), done = p.lessons || {};
  document.querySelectorAll('[data-leaf]').forEach(function (el) {
    var id = el.getAttribute('data-leaf'), written = Number(el.getAttribute('data-written') || 0);
    var n = Object.keys(done).filter(function (k) { return k.indexOf(id + '#') === 0 && done[k].done; }).length;
    var chip = el.querySelector('.chip');
    if (chip && n) { chip.textContent = n + ' of ' + written + ' done'; chip.classList.add(n >= written ? 'done' : 'x'); }
    if (n && n < written) el.setAttribute('data-started', '1');
  });
  var firstNext = null;
  document.querySelectorAll('[data-lesson]').forEach(function (el) {
    var r = done[el.getAttribute('data-lesson')], chip = el.querySelector('.chip');
    if (r && r.done && chip) { chip.textContent = r.score != null ? 'Done · ' + Math.round(r.score * 100) + '%' : 'Done'; chip.className = 'chip done'; }
    else if (!firstNext && el.tagName === 'A') firstNext = el;
  });
  if (firstNext) { firstNext.classList.add('next'); var c = firstNext.querySelector('.chip'); if (c) c.textContent = 'Up next'; }
  var cont = document.querySelector('.continue');
  if (cont) document.querySelectorAll('[data-started]').forEach(function (el) { cont.appendChild(el.cloneNode(true)); });
  var box = document.getElementById('backup-code');
  if (box) {
    document.getElementById('backup-copy').addEventListener('click', function () {
      box.value = btoa(unescape(encodeURIComponent(JSON.stringify(read()))));
      box.select();
      if (navigator.clipboard) navigator.clipboard.writeText(box.value).then(function () { status('Copied. Paste it on your other device.'); }, function () { status('Select the code and copy it.'); });
    });
    document.getElementById('backup-load').addEventListener('click', function () {
      try {
        var incoming = JSON.parse(decodeURIComponent(escape(atob(box.value.trim()))));
        var cur = read(); cur.lessons = Object.assign({}, cur.lessons || {}, incoming.lessons || {});
        localStorage.setItem(KEY, JSON.stringify(cur)); status('Progress loaded.'); setTimeout(function () { location.reload(); }, 600);
      } catch (e) { status('That code didn’t work. Copy the whole code from your other device and try again.'); }
    });
  }
  function status(t) { var s = document.getElementById('backup-status'); if (s) s.textContent = t; }
})();
</script>
</body></html>
